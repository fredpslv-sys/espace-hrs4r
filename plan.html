<!DOCTYPE html>
<html lang="fr">
<head>

<title>Construire le plan d’action HRS4R 2027-2030</title>
<style>
/* Charte reprise de l'espace HRS4R : Segoe UI, bleu #0f2f63 / #1f4f8f, cyan #1aa3dc, fond #f4f6f8 */
:root{--bg:#f4f6f8;--surface:#fff;--ink:#1c2733;--muted:#566373;--line:#d6dde4;--accent:#1f4f8f;--bleu:#0f2f63;--cyan:#1aa3dc;--soft:#e6eef8;
--ok:#1b6e5a;--ok2:#e9f5ee;--warn:#94540a;--warn2:#fff8e6;--bad:#a1272f;--bad2:#fbecec;--vi:#6b4c9a;--vi2:#f1ecf8;--gy2:#eef1f4;
font-family:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box;min-width:0}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-size:14.5px;line-height:1.45}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid #0b57d0;outline-offset:2px}
.topbar{display:flex;align-items:center;gap:14px;padding:8px 16px;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
.topbar h1{margin:0;font-size:17px;font-weight:650;color:var(--bleu)}
.v{font-size:12px;color:var(--warn);background:var(--warn2);border:1px solid #e2c570;border-radius:6px;padding:2px 8px;font-weight:600}
.tabs{display:flex;gap:4px;background:var(--bg);padding:4px;border-radius:12px;flex-wrap:wrap}
.tabs button{border:0;background:transparent;padding:7px 12px;border-radius:9px;cursor:pointer;font-weight:550;color:var(--muted)}
.tabs button:hover{background:#e6ebf0;color:var(--ink)}
.tabs button[aria-selected=true]{background:var(--accent);color:#fff}
.tb{display:flex;gap:8px 12px;align-items:flex-end;padding:8px 16px;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap;position:sticky;top:0;z-index:5}
.tb label{display:flex;flex-direction:column;font-size:12.5px;color:var(--muted);gap:2px}
.tb select,.tb input[type=search]{border:1px solid var(--line);border-radius:8px;padding:6px 9px;background:#fff;font-size:14px;max-width:300px}
.tb label.ck{flex-direction:row;align-items:center;gap:6px;color:var(--ink);padding-bottom:6px}
.btn{border:1px solid #aab6c3;background:#fff;padding:6px 11px;border-radius:8px;cursor:pointer}
.btn:hover{background:var(--soft)}.btn.pri{background:var(--accent);color:#fff;border-color:var(--accent)}.btn.sm{padding:2px 8px;font-size:12.5px}
main{padding:14px 16px 50px;max-width:1500px;margin:0 auto}
.kpis{display:flex;gap:10px;flex-wrap:wrap;margin:4px 0 12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 14px}
.kpi b{display:block;font-size:20px;line-height:1.1;color:var(--bleu)}.kpi span{font-size:12px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin:12px 0;overflow:hidden}
.card>header{padding:10px 14px;background:#fbfcfd;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.card>header h2{margin:0;font-size:16px;font-weight:650}
.pid{background:var(--bleu);color:#fff;border-radius:4px;padding:1px 7px;font-size:13px}
.mut{color:var(--muted);font-size:12.5px}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;vertical-align:top;padding:8px 9px;border-top:1px solid var(--line);font-size:13.5px}
th{font-size:12px;color:var(--muted);font-weight:600;background:#fbfcfd;position:sticky;top:0}
.t{display:inline-block;border-radius:4px;padding:1px 6px;font-size:11.5px;font-weight:650;white-space:nowrap;margin:1px 3px 1px 0}
.kSD{background:var(--vi2);color:var(--vi)}.kPA{background:var(--soft);color:var(--accent)}.kGT{background:var(--warn2);color:var(--warn)}
.qF{background:var(--ok2);color:var(--ok)}.qP{background:var(--gy2);color:var(--muted)}.qI{background:#fff;color:var(--muted);border:1px dashed var(--line)}
.ax{background:var(--gy2);color:var(--ink)}
.sc{display:inline-block;min-width:40px;text-align:center;border-radius:12px;font-weight:700;font-size:12px;padding:1px 6px}
.s3{background:var(--ok2);color:var(--ok)}.s2{background:var(--warn2);color:var(--warn)}.s1{background:var(--gy2);color:var(--muted)}
.st{font-size:12px;font-weight:650;border-radius:6px;padding:2px 7px;white-space:nowrap}
.st-A_ARBITRER{background:var(--gy2);color:var(--muted)}.st-CONSERVER,.st-ADAPTER,.st-ADOSSER{background:var(--ok2);color:var(--ok)}
.st-FUSIONNER{background:var(--soft);color:var(--accent)}.st-ECARTER{background:var(--bad2);color:var(--bad);text-decoration:line-through}
.cov{font-weight:650;font-size:12px;border-radius:6px;padding:2px 8px}
.c-complete{background:var(--ok2);color:var(--ok)}.c-partielle{background:var(--warn2);color:var(--warn)}.c-aucune{background:var(--bad2);color:var(--bad)}
.row{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:12px;padding:10px 14px;border-top:1px solid var(--line)}
.row.ecart{opacity:.55}
.dec{display:flex;flex-direction:column;gap:5px}
.dec select,.dec input{border:1px solid var(--line);border-radius:7px;padding:4px 7px;font-size:13px;background:#fff;width:100%}
.prop{font-size:12.5px;background:#fbfcfd;border-left:3px solid var(--cyan);padding:4px 8px;margin-top:4px}
.alert{background:var(--bad2);color:var(--bad);border-radius:8px;padding:8px 12px;margin:8px 0;font-size:13.5px}
.info{background:var(--warn2);border-radius:8px;padding:8px 12px;margin:8px 0;font-size:13.5px}
.sel{border:1px solid var(--line);border-radius:6px;padding:1px 3px;font-size:12.5px;background:#fff}
.grp{padding:10px 14px;border-top:1px solid var(--line)}
.grp input.title{width:100%;font-weight:600;font-size:14.5px;border:1px solid var(--line);border-radius:7px;padding:6px 8px}
.grp ul{margin:6px 0 0;padding-left:18px}
textarea{width:100%;min-height:120px;font:12px/1.4 ui-monospace,monospace;border:1px solid var(--line);border-radius:6px}
.scroll{overflow-x:auto}
details summary{cursor:pointer;color:var(--accent);font-size:12.5px;font-weight:600}
@media(max-width:860px){.row{grid-template-columns:1fr}.tb{position:static}.stack thead{display:none}.stack tr{display:grid;border-top:1px solid var(--line);padding:6px 0}.stack td{border:0;padding:3px 9px}.stack td::before{content:attr(data-l);display:block;font-size:11px;color:var(--muted);font-weight:600}.stack td:empty{display:none}}
</style>
</head>

const dec=id=>ST.dec[id]||{};

// racine d'un élément (suivi des fusions)
function root(id,seen=new Set()){if(seen.has(id))return null;seen.add(id);const s=st(id);if(KEEP.has(s))return id;if(s==='FUSIONNER'){const t=dec(id).tgt||I[id].prop[1];return t?root(t,seen):null}return null}
function groups(){const g={};D.items.forEach(it=>{const s=st(it.id);if(!KEEP.has(s)&&s!=='FUSIONNER')return;const r=root(it.id);if(!r){(g._orph=g._orph||[]).push(it.id);return}(g[r]=g[r]||[]).push(it.id)});return g}

const princOK=p=>(!F.axe||(p.axes[F.axe]||0)>0)&&(!F.pil||String(p.pil)===F.pil);
function needOK(n){if(F.pid&&n.pid!==F.pid)return false;if(!princOK(P[n.pid]))return false;if(F.axe&&!n.axes.includes(+F.axe))return false;return true}
function itemOK(it){if(F.kind&&it.kind!==F.kind)return false;if(F.prop&&st(it.id)!==F.prop)return false;
  if(F.axe&&!it.axes.includes(+F.axe))return false;

function needChips(it){return links(it).map(l=>{const n=NB[l.b];return `<div><span class="t q${l.q==='F'?'F':l.q==='I'?'I':'P'}" title="Lien ${l.q==='F'?'fort':l.q==='I'?'indirect':l.q==='INF'?'inféré':'partiel'}">${l.q==='INF'?'INF':l.q}</span><b>${n.pid}</b> ${esc(n.theme)}</div>`}).join('')+(it.hors?`<div class="mut"><i>Hors besoin prioritaire : ${esc(it.hors[0]+' '+it.hors[1])}</i></div>`:'')}

  return h}
function methView(){const m=D.meta;return `<div class="card" style="padding:14px 18px"><h2 style="margin-top:0">Méthode</h2><ol>

  document.querySelectorAll('[data-tg]').forEach(s=>s.onchange=e=>{setDec(e.target.dataset.tg,{tgt:e.target.value})});
  document.querySelectorAll('[data-ti]').forEach(s=>s.onchange=e=>{ST.dec[e.target.dataset.ti]=Object.assign({},ST.dec[e.target.dataset.ti],{title:e.target.value});save()});
  document.querySelectorAll('[data-ap]').forEach(b=>b.onclick=()=>{const it=I[b.dataset.ap];setDec(it.id,{st:it.prop[0],tgt:it.prop[1]||undefined})});
  on('apAll','click',()=>{D.items.forEach(it=>{if(st(it.id)==='A_ARBITRER'&&it.prop[0]!=='A_ARBITRER')ST.dec[it.id]=Object.assign({},ST.dec[it.id],{st:it.prop[0],tgt:it.prop[1]||undefined})});save();render()});
  on('rz','click',()=>{Object.values(ST.dec).forEach(d=>{delete d.st;delete d.tgt});save();render()});
  on('xCsv','click',()=>{const g=groups(),L=[['axe','action','intitule_2027_2030','origine','libelle_source','etat','elements_fusionnes','besoins','cotation']];
    Object.keys(g).filter(k=>k!=='_orph').forEach(r=>{const it=I[r];L.push([it.axes[0]||'',r,dec(r).title||'',it.src,it.label,STL[st(r)],g[r].filter(x=>x!==r).join(' | '),[...new Set(g[r].flatMap(x=>I[x].needs.filter(l=>l.main).map(l=>NB[l.b].pid+' '+NB[l.b].theme)))].join(' | '),tot(it)])});
    copy(L.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(';')).join('\n'),'Futur plan copié (CSV, séparateur point-virgule).')});
  on('xJson','click',()=>copy(JSON.stringify({version:D.meta.version,exporte_le:new Date().toISOString(),decisions:ST.dec},null,1),'Arbitrages copiés (JSON).'));
  on('xImp','change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);ST.dec=Object.assign(ST.dec,o.decisions||{});save();render()}catch(err){document.getElementById('xMsg').textContent='Fichier illisible.'}};r.readAsText(f)});
}
render();
}
</script>
</body>
</html>
